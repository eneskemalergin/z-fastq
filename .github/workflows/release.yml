# Publishes a release for a vX.Y.Z tag, in three steps; any failure stops it.
#
# - gate: the tag names the build.zig.zon version and its CHANGELOG.md entry, it is main's head, and main's CI on
#   that commit passed (waited for, checking every two minutes, if it is still running). A bad tag fails in seconds.
# - verify: the whole CI again on the tagged commit, without caches, keeping the tested archives.
# - publish: checksums and notes, then a draft release, so a failed upload or attestation can be re-run without a
#   half-published release; attestations; and only then the public release.
#
# Started by hand on main, it rehearses the release for main's version: the same gate (without a tag to check)
# and verify, and no publish. The tested archives stay on the run for seven days.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the tag, version, and notes
        id: tag
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/release.sh version)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main || { echo "a rehearsal runs on main, not $GITHUB_REF" >&2; exit 1; }
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z: $tag" >&2; exit 1; }
            test "$tag" = "v$version" || { echo "tag $tag does not match version $version" >&2; exit 1; }
          fi
          bash .github/scripts/release.sh notes "$tag" > /dev/null
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check the commit is main's head
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          main=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          test "$GITHUB_SHA" = "$main" || { echo "$TAG at $GITHUB_SHA is not main's head ($main)" >&2; exit 1; }

      - name: Require main's CI to pass on the tagged commit
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          while :; do
            run=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion,url --jq '.[0] // empty | [.status, .conclusion, .url] | @tsv')
            if [[ -n "$run" ]]; then
              IFS=$'\t' read -r status conclusion url <<< "$run"
              if [[ "$status" == completed ]]; then
                test "$conclusion" = success || { echo "CI on main concluded $conclusion: $url" >&2; exit 1; }
                echo "CI on main passed: $url"
                break
              fi
            fi
            ((SECONDS < deadline)) || { echo "CI on main has not passed for $GITHUB_SHA: ${run:-no run}" >&2; exit 1; }
            sleep 120
          done

  verify:
    name: Verify release
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    name: Publish release
    needs: [gate, verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the tag still names the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          test "$tagged" = "$GITHUB_SHA" || { echo "tag $TAG moved to $tagged during the release" >&2; exit 1; }

      - name: Download the tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Prepare notes and checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          for name in source linux-x86_64 linux-aarch64; do
            test -s "z-fastq-$VERSION-$name.tar.gz" || { echo "missing tested archive: z-fastq-$VERSION-$name.tar.gz" >&2; exit 1; }
          done
          count=$(find . -maxdepth 1 -type f | wc -l)
          test "$count" -eq 3 || { echo "expected the 3 tested archives, found $count files: $(ls)" >&2; exit 1; }
          sha256sum ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/release.sh notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create or resume the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo "release $TAG is already published" >&2; exit 1; }
          else
            gh release create "$TAG" --draft --verify-tag --title "z-fastq $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/assets"/* --clobber

      - name: Attest the release packages
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest --verify-tag
