# Checks every pull request and push to main; any other branch runs on request, so no commit is tested twice.
# The first failure stops the run: a failed lane cancels the others, and nothing is packaged after a failed test.
#
# - checks: seconds on one runner. Picks what the rest must run (documentation, benchmark reports, and peer-tool
#   recipes skip the builds; without a base commit in the shallow clone, everything runs) and fails fast on format,
#   script syntax, lint of the CI scripts, broken documentation links, and a version without its CHANGELOG.md entry.
# - workflows: actionlint from a pinned image and zizmor, when .github/ changes.
# - test: one lane per system, Linux and macOS on x86-64 and aarch64. Each runs the tests once in Debug, which
#   keeps every safety check at the lowest build cost; the x86-64 lanes build for generic x86-64 (core2 on macOS),
#   so AVX2 is reached through run-time dispatch as in the release binary. Each lane then builds its ReleaseFast
#   release binary (static on Linux) and smoke-tests it; the Linux x86-64 lane also builds the source package a
#   Zig dependent fetches and tests it from a fresh package.
# - avx512: on an emulated AVX-512 CPU (Intel SDE, pinned by version and checksum), so the AVX-512 kernels run
#   whatever CPU the runner has: the source tests in Debug, then every command of a ReleaseFast build on generated
#   reads, whose output must match the baseline tier byte for byte. The suites that start many CLI processes are
#   too slow under the emulator. Then, on the runner's own CPU, ReleaseFast builds for -Dcpu=x86_64_v3 and
#   -Dcpu=native must refuse ZFASTQ_TIER=baseline, which the default build accepts: release builds keep -Dcpu.
# - result: one required check for branch protection, whichever jobs ran.
#
# On main, the tested archives are kept for seven days; the release workflow publishes those for a tag instead of
# building again. A commit whose push skipped the tests gets them by running this workflow on main by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.16.0

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
      workflows: ${{ steps.changes.outputs.workflows }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          tests=true
          workflows=true
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && -n "$BASE" ]] &&
            git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            tests=false
            workflows=false
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/*) tests=true; workflows=true ;;
                *.md|LICENSE|assets/*|bench/*|tools/*|wiki/*|.gitignore) ;;
                *) tests=true ;;
              esac
            done < <(git diff --no-renames --name-only -z "$BASE" HEAD)
          fi
          printf 'tests=%s\nworkflows=%s\n' "$tests" "$workflows" >> "$GITHUB_OUTPUT"

      - name: Check version and release notes
        id: version
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/release.sh version)
          bash .github/scripts/release.sh notes > /dev/null
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check documentation links
        run: bash .github/scripts/docs_check.sh

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: checks

      - name: Check format and scripts
        run: |
          set -euo pipefail
          test "$(zig version)" = "$ZIG_VERSION"
          zig fmt --check build.zig build.zig.zon src tests
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')
          shellcheck -x .github/scripts/*.sh
          python3 -m compileall -q bench/lib tools/wiki_figures.py

  workflows:
    name: Workflow checks
    needs: checks
    if: needs.checks.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check workflow syntax
        run: >-
          docker run --rm -v "${PWD}:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: Check workflow security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
        with:
          inputs: .github/
          advanced-security: false
          online-audits: false
          annotations: true
          version: v1.30.1

  test:
    name: Test (${{ matrix.name }})
    needs: checks
    if: needs.checks.outputs.tests == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-24.04
            flags: -Dcpu=baseline
            system: linux-x86_64
            source: true
          - name: aarch64
            runner: ubuntu-24.04-arm
            flags: ""
            system: linux-aarch64
            source: false
          - name: macos-x86-64
            runner: macos-15-intel
            flags: -Dcpu=baseline
            system: macos-x86_64
            source: false
          - name: macos-aarch64
            runner: macos-15
            flags: ""
            system: macos-aarch64
            source: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.name }}

      - name: Test in Debug
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          read -ra flags <<< "$FLAGS"
          zig build test ${flags[@]+"${flags[@]}"} --summary all

      - name: Package and smoke-test the release binary
        env:
          SYSTEM: ${{ matrix.system }}
        run: bash .github/scripts/release.sh package "$SYSTEM" "$RUNNER_TEMP/release"

      - name: Build, fetch, and test the source package
        if: matrix.source
        run: bash .github/scripts/release.sh package source "$RUNNER_TEMP/release"

      - name: Keep the tested archives
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.system }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  avx512:
    name: Test (x86-64 AVX-512 under Intel SDE)
    needs: checks
    if: needs.checks.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: avx512

      - name: Install Intel SDE
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sde.tar.xz" "$SDE_URL"
          printf '%s  %s\n' "$SDE_SHA256" "$RUNNER_TEMP/sde.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1

      - name: Test in Debug with the AVX-512 kernels
        run: |
          set -euo pipefail
          sde="$RUNNER_TEMP/sde/sde64"
          grep -m1 'model name' /proc/cpuinfo
          zig build test-src -Dcpu=baseline -Dtest-exec="$sde" -Dtest-exec=-spr -Dtest-exec=-- --test-timeout 5m --summary all

      - name: Compare every command across the tiers
        run: |
          set -euo pipefail
          sde="$RUNNER_TEMP/sde/sde64"
          work="$RUNNER_TEMP/tiers"
          mkdir "$work"
          zig build -Doptimize=ReleaseFast --prefix "$work/release"
          binary="$work/release/bin/z-fastq"
          for mate in 1 2; do
            awk -v mate="$mate" 'BEGIN {
              srand(6 + mate)
              for (i = 0; i < 3000; i++) {
                n = (i % 3 == 0) ? 2000 : 150; s = ""; q = ""
                for (j = 0; j < n; j++) {
                  s = s substr("ACGTN", int(rand() * 5) + 1, 1)
                  q = q sprintf("%c", 35 + int(rand() * 40))
                }
                if (i % 4 == 0) s = substr(s, 1, n - 33) (mate == 1 ? "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA" : "AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT")
                printf "@r%d/%d\n%s\n+\n%s\n", i, mate, s, q
              }
            }' > "$work/r$mate.fastq"
          done
          r1="$work/r1.fastq"
          r2="$work/r2.fastq"
          run() {
            local tier="$1"
            shift
            ZFASTQ_TIER="$tier" "$sde" -spr -- "$binary" "$@"
          }
          for tier in baseline avx2 avx512; do
            {
              run "$tier" count "$r1" "$r2"
              run "$tier" stats --json "$r1"
              run "$tier" check --json --paired "$r1" "$r2"
              run "$tier" sample --fraction 0.5 --seed 3 "$r1"
              run "$tier" interleave "$r1" "$r2"
              rm -f "$work/out1.fastq" "$work/out2.fastq"
              run "$tier" process --adapter1 AGATCGGAAGAGCACACGTCTGAACTCCAGTCA --adapter2 AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT \
                --pair-duplication --report - --out1 "$work/out1.fastq" --out2 "$work/out2.fastq" "$r1" "$r2"
              cat "$work/out1.fastq" "$work/out2.fastq"
            } | cksum > "$work/$tier.sum"
            printf '%s: %s\n' "$tier" "$(cat "$work/$tier.sum")"
          done
          cmp "$work/baseline.sum" "$work/avx2.sum"
          cmp "$work/baseline.sum" "$work/avx512.sum"

      - name: Check that release builds keep -Dcpu
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tiers"
          ZFASTQ_TIER=baseline "$work/release/bin/z-fastq" --version
          for cpu in x86_64_v3 native; do
            zig build -Doptimize=ReleaseFast -Dcpu="$cpu" --prefix "$work/$cpu"
            if ZFASTQ_TIER=baseline "$work/$cpu/bin/z-fastq" --version; then
              echo "error: the -Dcpu=$cpu release build still runs the baseline tier"
              exit 1
            fi
          done

  result:
    name: CI result
    if: always()
    needs: [checks, workflows, test, avx512]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      CHECKS: ${{ needs.checks.result }}
      TESTS_NEEDED: ${{ needs.checks.outputs.tests }}
      TESTS: ${{ needs.test.result }}
      AVX512: ${{ needs.avx512.result }}
      WORKFLOWS_NEEDED: ${{ needs.checks.outputs.workflows }}
      WORKFLOWS: ${{ needs.workflows.result }}
    steps:
      - name: Check required results
        run: |
          set -euo pipefail
          test "$CHECKS" = success
          for pair in "$TESTS_NEEDED:$TESTS" "$TESTS_NEEDED:$AVX512" "$WORKFLOWS_NEEDED:$WORKFLOWS"; do
            case "$pair" in
              true:success|false:skipped) ;;
              *) printf 'Required check did not pass: %s\n' "$pair" >&2; exit 1 ;;
            esac
          done
