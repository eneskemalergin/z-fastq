# Checks every pull request and push to main; any other branch runs on request, so no commit is tested twice.
#
# - checks: seconds on one runner. Picks what the rest must run (documentation, benchmark reports, and peer-tool
#   recipes skip the builds; without a base commit in the shallow clone, everything runs) and fails fast on format,
#   script syntax, lint of the CI scripts, broken documentation links, and a version without its CHANGELOG.md entry.
# - workflows: actionlint from a pinned image and zizmor, when .github/ changes.
# - test: one checkout per configuration, since CLI tests share zig-out/bin/z-fastq. x86-64 runs all four: Debug
#   for the runner's CPU, so AVX2 compiles inline where it has it; static ReleaseSafe and ReleaseFast for baseline
#   x86-64, which reach AVX2 through run-time dispatch; and portable kernels. aarch64 has no dispatch, so it runs
#   Debug and ReleaseFast only. Each ReleaseFast lane packages its release binary and smoke-tests it.
# - source: the package a Zig dependent fetches, exactly the tracked .paths files, tested from a fresh package.
# - result: one required check for branch protection, whichever jobs ran.
#
# The release workflow calls this one with release: true, which runs everything without caches, requires a release
# tag to name the version, and keeps the tested archives.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Run every check without caches and keep the tested release archives
        type: boolean
        default: false
    outputs:
      version:
        description: The version build.zig.zon declares
        value: ${{ jobs.checks.outputs.version }}

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  ZIG_VERSION: 0.16.0

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
      workflows: ${{ steps.changes.outputs.workflows }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          set -euo pipefail
          tests=true
          workflows=true
          if [[ "$RELEASE" != true && "$GITHUB_EVENT_NAME" != workflow_dispatch && -n "$BASE" ]] &&
            git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            tests=false
            workflows=false
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/*) tests=true; workflows=true ;;
                *.md|LICENSE|assets/*|bench/*|tools/*|wiki/*|.gitignore) ;;
                *) tests=true ;;
              esac
            done < <(git diff --no-renames --name-only -z "$BASE" HEAD)
          fi
          printf 'tests=%s\nworkflows=%s\n' "$tests" "$workflows" >> "$GITHUB_OUTPUT"

      - name: Check version and release notes
        id: version
        env:
          TAG: ${{ github.ref_name }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/release.sh version)
          if [[ "$RELEASE" == true && "$GITHUB_REF_TYPE" == tag ]]; then
            bash .github/scripts/release.sh notes "$TAG" > /dev/null
          else
            bash .github/scripts/release.sh notes > /dev/null
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check documentation links
        run: bash .github/scripts/docs_check.sh

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: checks
          use-cache: ${{ !inputs.release }}

      - name: Check format and scripts
        run: |
          set -euo pipefail
          test "$(zig version)" = "$ZIG_VERSION"
          zig fmt --check build.zig build.zig.zon src tests
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')
          shellcheck -x .github/scripts/*.sh
          python3 -m compileall -q bench/lib tools/wiki_figures.py

  workflows:
    name: Workflow checks
    needs: checks
    if: needs.checks.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check workflow syntax
        run: >-
          docker run --rm -v "${PWD}:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: Check workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          inputs: .github/
          advanced-security: false
          online-audits: false
          annotations: true
          version: v1.30.1

  test:
    name: Test (${{ matrix.name }})
    needs: checks
    if: needs.checks.outputs.tests == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Debug
            runner: ubuntu-24.04
            flags: ""
          - name: x86-64 Debug, portable kernels
            runner: ubuntu-24.04
            flags: -Dkernel-backend=portable
          - name: x86-64 ReleaseSafe
            runner: ubuntu-24.04
            flags: -Dstatic=true -Doptimize=ReleaseSafe
          - name: x86-64 ReleaseFast
            runner: ubuntu-24.04
            flags: -Dstatic=true -Doptimize=ReleaseFast
            system: linux-x86_64
          - name: aarch64 Debug
            runner: ubuntu-24.04-arm
            flags: ""
          - name: aarch64 ReleaseFast
            runner: ubuntu-24.04-arm
            flags: -Dstatic=true -Doptimize=ReleaseFast
            system: linux-aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.name }}
          use-cache: ${{ !inputs.release }}

      - name: Test
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          read -ra flags <<< "$FLAGS"
          zig build test "${flags[@]}" --summary all

      - name: Package and smoke-test the release binary
        if: matrix.system
        env:
          SYSTEM: ${{ matrix.system }}
        run: bash .github/scripts/release.sh package "$SYSTEM" "$RUNNER_TEMP/release"

      - name: Keep the tested release binary
        if: matrix.system && inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.system }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  source:
    name: Source package
    needs: checks
    if: needs.checks.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: source
          use-cache: ${{ !inputs.release }}

      - name: Build, fetch, and test the source package
        run: bash .github/scripts/release.sh package source "$RUNNER_TEMP/release"

      - name: Keep the tested source package
        if: inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-source
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [checks, workflows, test, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      CHECKS: ${{ needs.checks.result }}
      TESTS_NEEDED: ${{ needs.checks.outputs.tests }}
      TESTS: ${{ needs.test.result }}
      SOURCE: ${{ needs.source.result }}
      WORKFLOWS_NEEDED: ${{ needs.checks.outputs.workflows }}
      WORKFLOWS: ${{ needs.workflows.result }}
    steps:
      - name: Check required results
        run: |
          set -euo pipefail
          test "$CHECKS" = success
          for pair in "$TESTS_NEEDED:$TESTS" "$TESTS_NEEDED:$SOURCE" "$WORKFLOWS_NEEDED:$WORKFLOWS"; do
            case "$pair" in
              true:success|false:skipped) ;;
              *) printf 'Required check did not pass: %s\n' "$pair" >&2; exit 1 ;;
            esac
          done
