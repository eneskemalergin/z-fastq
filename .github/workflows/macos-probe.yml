# Records the macOS runner facts the macOS build and its tests depend on: how a FIFO reader learns that a
# writer connected or left, and what /dev/stdin resolves to and shares with standard input. It builds nothing
# and changes nothing.
name: macos-probe

on:
  pull_request:

permissions: {}

jobs:
  probe:
    name: Probe (macos-15)
    runs-on: macos-15
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record FIFO waits and /dev/stdin
        shell: python3 {0}
        run: |
          import errno, os, select, subprocess, sys, tempfile, threading, time

          root = tempfile.mkdtemp(dir=os.environ["RUNNER_TEMP"])
          made = []

          def fifo():
              path = os.path.join(root, f"fifo-{len(made)}")
              os.mkfifo(path)
              made.append(path)
              return path

          def nonblocking_read(fd):
              try:
                  return repr(os.read(fd, 16))
              except BlockingIOError:
                  return "EAGAIN"

          def blocking_read(fd, seconds):
              result = []
              thread = threading.Thread(target=lambda: result.append(os.read(fd, 16)), daemon=True)
              thread.start()
              thread.join(seconds)
              return repr(result[0]) if result else "still blocked"

          def open_and_close_writer(path, data=b""):
              writer = os.open(path, os.O_WRONLY | os.O_NONBLOCK)
              if data:
                  os.write(writer, data)
              os.close(writer)

          def reader(path, blocking):
              fd = os.open(path, os.O_RDONLY | os.O_NONBLOCK)
              os.set_blocking(fd, blocking)
              return fd

          print("nonblocking read, no writer yet:", nonblocking_read(reader(fifo(), False)))
          print("blocking read, no writer yet, after 1 s:", blocking_read(reader(fifo(), True), 1))
          path = fifo()
          fd = reader(path, False)
          open_and_close_writer(path)
          print("nonblocking read after a writer opened and closed:", nonblocking_read(fd))
          os.set_blocking(fd, True)
          print("blocking read after a writer opened and closed:", blocking_read(fd, 1))
          for data in (b"", b"abc"):
              path = fifo()
              fd = reader(path, True)
              threading.Timer(0.3, open_and_close_writer, (path, data)).start()
              print(f"blocking read while a writer opens, writes {data!r}, and closes:", blocking_read(fd, 1.5))

          def poll_wait(fd, seconds):
              poller = select.poll()
              poller.register(fd, select.POLLIN)
              return poller.poll(int(seconds * 1000))

          def select_wait(fd, seconds):
              return select.select([fd], [], [], seconds)[0]

          def kqueue_wait(fd, seconds):
              queue = select.kqueue()
              queue.control([select.kevent(fd, filter=select.KQ_FILTER_READ, flags=select.KQ_EV_ADD)], 0, 0)
              return [f"flags=0x{event.flags:x} data={event.data}" for event in queue.control(None, 1, seconds)]

          print(f"EV_EOF=0x{select.KQ_EV_EOF:x} POLLIN={select.POLLIN} POLLHUP={select.POLLHUP}")
          for name, wait in (("poll", poll_wait), ("select", select_wait), ("kqueue", kqueue_wait)):
              path = fifo()
              fd = reader(path, False)
              print(f"{name}, no writer yet:", wait(fd, 0.5))
              path = fifo()
              fd = reader(path, False)
              open_and_close_writer(path)
              print(f"{name} after a writer opened and closed:", wait(fd, 0.5))
              for data in (b"", b"abc"):
                  path = fifo()
                  fd = reader(path, False)
                  threading.Timer(0.3, open_and_close_writer, (path, data)).start()
                  print(f"{name} while a writer opens, writes {data!r}, and closes:", wait(fd, 1.5))

          resolve = r'''
          import ctypes
          libc = ctypes.CDLL(None, use_errno=True)
          for symbol in ("realpath", "realpath$DARWIN_EXTSN"):
              function = getattr(libc, symbol)
              function.restype = ctypes.c_char_p
              function.argtypes = [ctypes.c_char_p, ctypes.c_char_p]
              for path in ("/dev/stdin", "/dev/fd/0", "/dev/fd/1"):
                  buffer = ctypes.create_string_buffer(1024)
                  print(symbol, path, function(path.encode(), buffer), ctypes.get_errno())
          '''
          shared = (
              "import os; os.read(0, 2); fd = os.open('/dev/stdin', os.O_RDONLY); "
              "print('after 2 bytes from fd 0, /dev/stdin reads', os.read(fd, 16))"
          )
          regular = os.path.join(root, "input.fastq")
          with open(regular, "w") as handle:
              handle.write("@a\nA\n+\n!\n")
          for code in (resolve, shared):
              with open(regular) as handle:
                  result = subprocess.run([sys.executable, "-c", code], stdin=handle, capture_output=True, text=True)
              print("regular-file standard input:", result.stdout.strip(), result.stderr.strip())
              result = subprocess.run([sys.executable, "-c", code], input="@a\nA\n+\n!\n", capture_output=True, text=True)
              print("pipe standard input:", result.stdout.strip(), result.stderr.strip())
